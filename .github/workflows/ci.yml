name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Rust tests
        working-directory: rustima
        run: cargo test --all-targets

      - name: Read minimum supported Rust version
        id: msrv
        working-directory: rustima
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["rust-version"]
          print(f"version={version}")
          PY

      - name: Install minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Run Rust tests with MSRV
        working-directory: rustima
        run: cargo +${{ steps.msrv.outputs.version }} test --locked --all-targets

  python-test:
    name: Python Tests (Tier A + Contract + Smoke)
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create venv and install deps
        working-directory: rustima
        run: |
          uv venv .venv
          uv pip install numpy pytest statsmodels scipy pandas

      - name: Build wheel and install
        working-directory: rustima
        run: |
          uv pip install maturin
          CARGO_TARGET_DIR=target_wheel uv run maturin build --out /tmp/wheels
          uv pip install --force-reinstall /tmp/wheels/rustima-*.whl

      - name: Run Python tests (excluding nightly)
        working-directory: rustima
        run: .venv/bin/python -m pytest python_tests/ -m "not nightly" -v --tb=short
